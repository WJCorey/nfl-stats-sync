[project]
name = "mushroom"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.17",
    "duckdb==1.5.5",
    "warmhub==0.5.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.17",
    "dagster-webserver==1.13.17",
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mushroom", "project"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "mushroom"
registry_modules = [
    "mushroom.components.*",
]
